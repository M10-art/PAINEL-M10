name: Compilar PAINEL M10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          archive=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$archive"
          mkdir projeto
          unzip -q "$archive" -d projeto
          project_dir=$(dirname "$(find projeto -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PAINEL-M10-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
