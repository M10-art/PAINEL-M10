
name: Compilar PAINEL M10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licencas Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          archive=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$archive"
          mkdir projeto
          unzip -q "$archive" -d projeto
          project_dir=$(dirname "$(find projeto -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PAINEL-M10-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
